name: KaleSavasi
options:
  bundleIdPrefix: com.alpsenel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: tr
targets:
  KaleSavasi:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alpsenel.kalesavasi
        DEVELOPMENT_TEAM: 6S7Q8F967Q
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: KaleSavasi
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "2.1"
        CURRENT_PROJECT_VERSION: "8"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Committed entitlements files, not XcodeGen's `entitlements:` block, so Debug can differ:
        # its copy adds get-task-allow, which storekitd needs before it serves StoreKitTest's
        # SKTestSession to an app launched by `xcodebuild test`. Keep the other keys in step.
        CODE_SIGN_ENTITLEMENTS: KaleSavasi.entitlements
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: KaleSavasi.debug.entitlements
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Keepfall
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations:
          - tr
          - en
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        NSLocalNetworkUsageDescription: Yakındaki bir oyuncuyla eşleşmek için yerel ağ kullanılır.
        NSBonjourServices:
          - _kale-savasi._tcp
          - _kale-savasi._udp
          - _kale-savasi4._tcp
          - _kale-savasi4._udp
        ITSAppUsesNonExemptEncryption: false
    scheme:
      # The shop's products for purchases in the simulator and from Xcode. A scheme setting, never
      # part of a build.
      storeKitConfiguration: StoreKit/Products.storekit
      testTargets:
        - KaleSavasiTests

  # Unit tests for the store and the cosmetics, run against the StoreKit configuration with
  # StoreKitTest: xcodebuild test -scheme KaleSavasi -destination 'platform=iOS Simulator,id=<udid>'
  KaleSavasiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - path: StoreKit
        buildPhase: resources
    dependencies:
      - target: KaleSavasi
      - sdk: StoreKitTest.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alpsenel.kalesavasi.tests
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: 6S7Q8F967Q
        CODE_SIGN_STYLE: Automatic
