name: KaleSavasi
options:
  bundleIdPrefix: com.alpsenel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: tr
targets:
  KaleSavasi:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alpsenel.kalesavasi
        DEVELOPMENT_TEAM: 6S7Q8F967Q
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: KaleSavasi
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Keepfall
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations:
          - tr
          - en
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        NSLocalNetworkUsageDescription: Yakındaki bir oyuncuyla eşleşmek için yerel ağ kullanılır.
        NSBonjourServices:
          - _kale-savasi._tcp
          - _kale-savasi._udp
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: KaleSavasi.entitlements
      properties:
        com.apple.developer.game-center: true
